<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | IG Energia</title>
<style>
:root{
  --brand:#004d0c;
  --accent:#8cc63f;
  --accent-hover:#9bd24f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#f3f6f4;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(12px,3vw,24px);
  padding-top:max(clamp(12px,3vw,24px),env(safe-area-inset-top));
  padding-bottom:max(clamp(12px,3vw,24px),env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.login-card{
  width:min(100%,390px);
  background:var(--brand);
  border-radius:22px;
  box-shadow:0 18px 50px rgba(0,55,12,.22);
  padding:32px 28px 28px;
}
.logo{
  display:block;
  width:220px;
  max-width:78%;
  height:auto;
  margin:0 auto 26px;
  background:transparent;
}
.field{margin-bottom:13px}
input{
  width:100%;
  min-height:52px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:13px;
  padding:0 15px;
  font-size:16px; /* evita zoom automático do Safari/iPhone */
  color:#17321f;
  outline:none;
  background:#fff;
  appearance:none;
  -webkit-appearance:none;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(140,198,63,.18)}
button{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
}
.btn-login{background:var(--accent);color:#103117}
.btn-login:hover{background:var(--accent-hover)}
.btn-register{margin-top:10px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.70)}
.btn-register:hover{background:rgba(255,255,255,.08)}
.register-area{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.register-area.active{display:block}
.back{margin-top:8px;background:transparent;color:rgba(255,255,255,.88);min-height:42px;padding:8px}
.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;background:rgba(255,255,255,.10);color:#fff}

@media (max-width:480px){
  body{
    align-items:flex-start;
    justify-content:center;
    padding-left:12px;
    padding-right:12px;
  }
  .login-card{
    width:100%;
    max-width:390px;
    margin:auto 0;
    border-radius:18px;
    padding:26px 18px 22px;
    box-shadow:0 12px 32px rgba(0,55,12,.18);
  }
  .logo{
    width:190px;
    max-width:72%;
    margin-bottom:22px;
  }
  .field{margin-bottom:11px}
  input,button{min-height:50px}
}

@media (max-width:390px){
  .login-card{padding:22px 16px 18px;border-radius:16px}
  .logo{width:175px;max-width:68%;margin-bottom:18px}
  input,button{min-height:48px}
}

@media (max-height:740px){
  body{align-items:flex-start}
  .login-card{margin:auto 0;padding-top:20px;padding-bottom:18px}
  .logo{width:170px;margin-bottom:16px}
  .field{margin-bottom:10px}
  input,button{min-height:46px}
  .register-area{margin-top:10px;padding-top:10px}
}

@media (max-height:640px){
  body{overflow-y:auto}
  .login-card{margin:8px 0}
}
</style>
</head>

  <form id="loginForm">
    <div class="field"><input id="email" type="email" placeholder="E-mail" autocomplete="email" required></div>
    <div class="field"><input id="password" type="password" placeholder="Senha" autocomplete="current-password" required></div>
    <button class="btn-login" type="submit">Entrar</button>
    <button class="btn-register" type="button" id="openRegister">Cadastrar / Ativar acesso</button>
  </form>

  <form id="registerForm" class="register-area">
    <div class="field"><input id="regName" type="text" placeholder="Nome" autocomplete="name" required></div>
    <div class="field"><input id="regEmail" type="email" placeholder="E-mail" autocomplete="email" required></div>
    <div class="field"><input id="regPassword" type="password" placeholder="Criar senha" autocomplete="new-password" minlength="6" required></div>
    <div class="field"><input id="regPassword2" type="password" placeholder="Confirmar senha" autocomplete="new-password" minlength="6" required></div>
    <button class="btn-login" type="submit">Criar / Ativar conta</button>
    <button class="back" type="button" id="backLogin">Voltar ao login</button>
  </form>

  <div class="msg" id="msg"></div>
</div>
<script>
const loginForm=document.getElementById('loginForm');
const registerForm=document.getElementById('registerForm');
const msg=document.getElementById('msg');
function showMsg(t){msg.textContent=t;msg.style.display='block';}
document.getElementById('openRegister').onclick=()=>{loginForm.style.display='none';registerForm.classList.add('active');msg.style.display='none';};
document.getElementById('backLogin').onclick=()=>{registerForm.classList.remove('active');loginForm.style.display='block';msg.style.display='none';};
loginForm.addEventListener('submit',e=>{e.preventDefault();showMsg('Pronto para conectar ao Firebase Authentication.');
  // Firebase: signInWithEmailAndPassword(auth, email, password)
});
registerForm.addEventListener('submit',e=>{
  e.preventDefault();
  const p1=document.getElementById('regPassword').value;
  const p2=document.getElementById('regPassword2').value;
  if(p1!==p2){showMsg('As senhas não conferem.');return;}
  showMsg('Cadastro pronto para ativação pelo Firebase.');
  // Firebase: createUserWithEmailAndPassword(auth, regEmail, regPassword)
  // Opcional: salvar nome/perfil no Firestore após criação da conta.
});
</script>
</body>
